aid: bitcoin
name: Bitcoin
description: 'Bitcoin is the original decentralized peer-to-peer digital currency and open-source
  protocol, first described in the 2008 whitepaper by Satoshi Nakamoto. It is not a company or a
  hosted commercial API; the reference implementation, Bitcoin Core, exposes a local JSON-RPC
  interface for node operators and application developers to query the blockchain, manage wallets,
  build and broadcast transactions, and interact with the peer-to-peer network. bitcoin.org and the
  developer documentation site at developer.bitcoin.org publish developer guides, an extensive RPC
  API command reference, worked examples, and reference material for building Bitcoin applications.
  This profile was seeded as a Ribbit Capital portfolio-sector lead and enriched from Bitcoin''s
  public developer surface.'
